ent;box-shadow:0 6px 22px var(--shade)}.toast[hidden]{display:none}.login-card{width:380px;max-width:100%;margin:45px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px}.login-card .brand{margin:0 0 22px}.login-card h2{font-size:24px}.login-card .primary{width:100%;margin-top:7px}.login-card>p{font-size:13px;color:var(--muted);margin:10px 0 24px}.empty-note{padding:45px 20px;text-align:center;color:var(--muted);font-size:13px}.mobile .app{width:390px;max-width:100%;height:780px;max-height:calc(100dvh - 105px);min-height:480px;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 72px;border-radius:25px}.mobile .rail{grid-column:1;grid-row:2;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px 8px 8px;gap:0;background:var(--surface)}.mobile .rail .brand,.mobile .rail .spacer,.mobile .nav[data-page=agents]{display:none}.mobile .nav{min-height:56px;min-width:72px}.mobile .nav .avatar{display:none}.mobile .nav[data-page=me] .user-icon{display:block}.mobile .list-pane{grid-column:1;grid-row:1;border:0}.mobile .content{display:none;grid-column:1;grid-row:1/3}.mobile .app.in-chat .content{display:flex}.mobile .app.in-chat .rail,.mobile .app.in-chat .list-pane{display:none}.mobile .mobile-back{display:flex}.mobile .chat-header{height:72px;padding:10px 12px;gap:4px}.mobile .chat-header .avatar{display:none}.mobile .chat-header .row{gap:4px}.mobile .chat-header h2{font-size:15px}.mobile .chat-header .muted{font-size:11px}.mobile .message-scroll{padding:20px 14px 12px}.mobile .message{gap:8px;margin-bottom:23px}.mobile .message .avatar{height:29px;width:29px;border-radius:9px;font-size:12px}.mobile .message .body{max-width:calc(100% - 38px)}.mobile .message.mine .body{max-width:88%}.mobile .bubble{font-size:15px;padding:11px 13px}.mobile .ai-answer{padding:13px 14px;font-size:14px}.mobile .composer-wrap{padding:10px 12px 20px}.mobile .composer-hint .keyboard-hint{display:none}.mobile .composer-hint{font-size:10px}.mobile .page-area{grid-column:1;grid-row:1;padding:24px 18px}.mobile .page-area h1{font-size:23px}.mobile .agent-grid{grid-template-columns:1fr;gap:14px}.mobile .agent-card{padding:19px}.mobile .page-header{margin-bottom:22px}.mobile .settings-card{padding:18px}.mobile .drawer{width:100%;border:0}.mobile .primary,.mobile .secondary,.mobile .icon-button{min-height:48px}.mobile .mention-button,.mobile .chip{min-height:44px}.mobile .composer .primary{min-height:44px}.mobile .login-card{margin:0 auto;padding:25px 20px;border:0;background:transparent}.user-icon{display:none}.auth-mode .rail,.auth-mode .list-pane,.auth-mode .content{display:none}.auth-mode .page-area{grid-column:1/4;display:block}.mobile .auth-mode .page-area{grid-column:1;grid-row:1/3}.mobile .chat-header .more-label{display:none}
@media(max-width:1100px){.app{grid-template-columns:64px 280px minmax(0,1fr)}.chat-header{padding:16px 20px}.message-scroll{padding-left:20px;padding-right:20px}.composer-wrap{padding-left:20px;padding-right:20px}.page-area{padding:28px}.agent-grid{grid-template-columns:1fr}}
@media(max-width:899px){.workspace{padding:0 8px 12px}.demo-bar{padding:10px 12px;align-items:flex-start;flex-direction:column}.app{grid-template-columns:64px minmax(0,1fr);height:calc(100dvh - 130px)}.list-pane{grid-column:2}.content{display:none;grid-column:2}.app.in-chat .content{display:flex}.app.in-chat .list-pane{display:none}.mobile-back{display:flex}.page-area{grid-column:2}.auth-mode .page-area{grid-column:1/3}}

<body>
<header class="demo-bar">
  <div><div class="demo-title">AIChat / 界面设计参考</div><small>独立演示模板 · 虚构数据 · 不连接真实服务</small></div>
  <div class="demo-tools" aria-label="模板预览控制">
    <button id="desktopMode" aria-pressed="true">桌面</button><button id="mobileMode" aria-pressed="false">手机</button>
    <button id="themeToggle">切换深色</button><button id="loginPreview">登录页</button>
    <label class="tiny" for="stateSelect">任务状态</label><select id="stateSelect"><option value="succeeded">已完成</option><option value="queued">排队中</option><option value="dispatched">已派发</option><option value="running">运行中</option><option value="cancel_requested">取消中</option><option value="failed">失败</option><option value="cancelled">已停止</option><option value="expired">已超时</option><option value="recovery_required">结果未知</option><option value="offline">客户端断线</option></select>
  </div>
</header>
<div class="workspace" id="workspace">
<main class="app" id="app">
  <nav class="rail" aria-label="主导航">
    <div class="brand" aria-label="AIChat" data-icon="brand"></div>
    <button class="nav active" data-page="sessions"><span data-icon="chat"></span><span>会话</span></button>
    <button class="nav" data-page="contacts"><span data-icon="contacts"></span><span>联系人</span></button>
    <button class="nav" data-page="agents"><span data-icon="spark"></span><span>我的 AI</span></button>
    <div class="spacer"></div>
    <button class="nav" data-page="me"><span class="avatar">林</span><span class="user-icon" data-icon="user"></span><span>我的</span></button>
  </nav>
  <section class="list-pane" aria-label="会话列表">
    <div class="list-heading"><div class="between"><h1>会话</h1><button class="icon-button" id="createButton" aria-label="新建会话" data-icon="plus"></button></div><p>让想法，在对话里向前一步。</p></div>
    <label class="search"><span data-icon="search"></span><input id="searchInput" aria-label="筛选当前会话" placeholder="筛选当前会话"></label>
    <div class="section-label">最近的对话</div>
    <div class="conversations" id="conversationList"></div>
    <div class="list-footer"><span class="dot"></span><span id="connectionLabel">实时连接已建立</span></div>
  </section>
  <section class="content" aria-label="聊天">
    <header class="chat-header"><div class="row grow"><button class="mobile-back icon-button" id="backButton" aria-label="返回会话列表" data-icon="back"></button><div class="avatar group" id="chatAvatar">共</div><div class="grow"><div class="row" style="gap:8px"><h2 id="chatTitle">周末项目组</h2><span class="tag" id="chatTag">群聊</span></div><div class="muted truncate" id="chatSubtitle">2 位人类 · 1 位 AI</div></div></div><button class="icon-button" id="detailsButton" aria-label="查看会话详情" data-icon="more"></button></header>
    <div class="connection-banner" id="connectionBanner" role="status">正在重新连接，消息状态稍后更新。</div>
    <div class="message-scroll" id="messageScroll"><div class="message-inner" id="messages"></div></div>
    <div class="composer-wrap"><div class="composer"><div class="chip-row" id="mentionChips"></div><textarea id="draft" rows="2" aria-label="消息内容" placeholder="写下你的想法…"></textarea><div class="composer-footer"><button class="mention-button" id="mentionButton"><span>@</span><span>选择 AI</span></button><button class="primary" id="sendButton" disabled>发送<span data-icon="send"></span></button></div></div><div class="composer-hint"><span id="targetHint">未选择 AI，这条消息只发送到群聊</span><span class="keyboard-hint">Enter 发送 · Shift + Enter 换行</span></div></div>
  </section>
  <section class="page-area" id="pageArea" aria-label="页面内容"></section>
  <div class="drawer-shade" id="drawerShade"><section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1"></section></div>
  <div id="toast" class="toast" role="status" hidden></div>
</main>
</div>
<script>

    if(target.id==='createButton')openDrawer('开始一段对话','<p>选择接下来要做的事。</p><button class="choice" data-page-link="contacts">找联系人，发起私聊 <span>→</span></button><button class="choice" id="groupPreview">创建群聊 <span>→</span></button>');
    if(target.id==='groupPreview')openDrawer('创建群聊','<p>正式客户端依次选择联系人、填写群名、发送邀请。发出邀请并不等于成员已经加入。</p><form id="groupForm"><label class="field">群名称<input name="title" required maxlength="64" placeholder="给讨论起一个名字"></label><label class="check-row"><input type="checkbox" required>邀请陈一（演示联系人）</label><button class="primary">预览邀请结果</button></form>');
    if(target.id==='exitLogin')setPage('sessions');if(target.id==='registerPreview')openDrawer('邀请注册','<form id="registerForm"><label class="field">邀请码<input required autocomplete="off" placeholder="由管理员提供"></label><label class="field">账号名<input required autocomplete="off" maxlength="64"></label><label class="field">昵称<input required maxlength="64"></label><label class="field">密码<input required type="password" autocomplete="off" placeholder="请勿输入真实密码"></label><button class="primary">预览注册结果</button></form>');
  });
  $('app').addEventListener('submit',event=>{event.preventDefault();const form=event.target;if(form.id==='contactForm'){$('contactResult').textContent='演示模式未查询真实账号。正式实现需按完整账号名调用现有查询接口。';return;}if(form.id==='loginForm'){form.reset();setPage('sessions');toast('进入界面预览，未登录真实账号');return;}if(form.id==='createAIForm'){form.reset();openDrawer('选择接入方式','<p>身份创建后，可接入模型 API 或绑定外部连接器。此模板不会创建真实账号。</p><button class="choice" data-action="agentDetails">模型 API 配置参考 →</button><button class="choice" data-action="pairing">连接自己的设备 →</button>');return;}if(form.id==='groupForm'){closeDrawer();toast('邀请结果示意：等待对方接受，尚未加入');return;}if(form.id==='profileForm'){closeDrawer();toast('资料表单已演示，未写入账号');return;}if(form.id==='registerForm'){form.reset();closeDrawer();toast('注册表单演示完成，未创建真实账号');}});
  $('app').addEventListener('change',event=>{if(event.target.id==='pairCheck')$('pairApprove').disabled=!event.target.checked;});
  $('drawerShade').addEventListener('click',event=>{if(event.target===$('drawerShade'))closeDrawer();});
  document.addEventListener('keydown',event=>{if(!$('drawerShade').classList.contains('open'))return;if(event.key==='Escape')closeDrawer();if(event.key==='Tab'){const focusables=[...$('drawer').querySelectorAll('button,input,textarea,select,summary,[href]')].filter(el=>!el.disabled);if(!focusables.length){event.preventDefault();return;}const first=focusables[0],last=focusables.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===$('drawer'))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||document.activeElement===$('drawer'))){event.preventDefault();first.focus();}}});
  $('draft').addEventListener('input',()=>$('sendButton').disabled=!$('draft').value.trim());$('draft').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing&&!$('workspace').classList.contains('mobile')){event.preventDefault();send();}});
  $('searchInput').addEventListener('input',renderList);$('desktopMode').onclick=()=>setMobile(false);$('mobileMode').onclick=()=>setMobile(true);$('themeToggle').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('themeToggle').textContent=dark?'切换浅色':'切换深色';};$('loginPreview').onclick=()=>{closeDrawer();showLogin();};$('stateSelect').onchange=event=>{state=event.target.value;if(page!=='sessions'||loginMode)setPage('sessions');current='group';renderList();renderChat();$('app').classList.add('in-chat');};
  renderList();renderChat();setPage('sessions');const mobileBreakpoint=window.matchMedia('(max-width:767px)');mobileBreakpoint.addEventListener('change',event=>setMobile(event.matches));if(mobileBreakpoint.matches)setMobile(true);
})();
</script>
